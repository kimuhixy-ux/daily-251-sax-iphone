<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6b5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily 251" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Daily Ⅱ–Ⅴ–Ⅰ Sax Practice</title>
  <style>
    :root { color-scheme: light; --bg:#f6f2ea; --card:#fffdf8; --ink:#201f1b; --muted:#6f665b; --line:#d7cfc1; --accent:#0f6b5f; --accent-2:#b45137; --soft:#efe7d9; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:760px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
    h1 { font-size:26px; line-height:1.15; margin:12px 0 4px; letter-spacing:0; }
    .sub { color:var(--muted); margin:0 0 18px; font-size:14px; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
    .controls .full { grid-column:1 / -1; }
    label { display:block; color:var(--muted); font-size:12px; margin:0 0 5px; }
    select, button, input[type=number] { width:100%; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:16px; background:#fffdf8; color:var(--ink); box-sizing:border-box; }
    button { background:var(--accent); color:white; border-color:var(--accent); font-weight:700; }
    button.secondary { background:#fffdf8; color:var(--accent); }
    button:disabled { opacity:.4; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; box-shadow:0 10px 28px rgba(61,45,27,.10); }
    .date { color:var(--muted); font-size:13px; margin:0 0 10px; }
    .name { font-size:22px; font-weight:800; margin:0 0 16px; color:var(--accent-2); }
    .section { color:var(--muted); font-size:13px; font-weight:700; margin:16px 0 7px; }
    .score { background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:10px 6px; overflow-x:auto; }
    .score svg { display:block; margin:0 auto; }
    .tip { font-size:17px; line-height:1.6; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:14px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .ireal-actions { display:grid; grid-template-columns:1fr; gap:8px; margin-top:12px; }
    .status { min-height:18px; color:var(--muted); font-size:13px; margin:8px 0 0; }
    details { margin-top:16px; color:var(--muted); }
    details div { margin-top:8px; line-height:1.7; }
    @media (max-width:420px){ h1{font-size:23px}.controls,.actions{grid-template-columns:1fr} }
  </style>
</head>
<body>
<main>
  <h1>Daily Ⅱ–Ⅴ–Ⅰ Sax Practice</h1>
  <p class="sub">毎日のジャズ理論フレーズ練習</p>

  <div class="controls">
    <div class="full"><label for="category">カテゴリー</label><select id="category"></select></div>
    <div id="modeField"><label for="mode">モード</label><select id="mode"></select></div>
    <div id="keyField"><label for="key">キー</label><select id="key"></select></div>
  </div>

  <section class="card">
    <p class="date" id="dateLine"></p>
    <p class="name" id="phraseName"></p>
    <div class="score" id="score"></div>
    <p class="section">今日のポイント</p>
    <div class="tip" id="tip"></div>
  </section>

  <div class="ireal-actions" id="irealSection">
    <button id="irealBtn">iReal Proで開く</button>
    <button class="secondary" id="copyBtn">iReal Pro用リンクをコピー</button>
    <p class="status" id="irealStatus"></p>
  </div>

  <div class="controls">
    <div><label for="tempoInput">テンポ(BPM)</label><input type="number" id="tempoInput" min="30" max="240" step="1" value="90"></div>
    <div><label for="repeatInput">再生回数</label><input type="number" id="repeatInput" min="1" max="20" step="1" value="1"></div>
  </div>
  <div class="actions" style="grid-template-columns:1fr;">
    <button class="secondary" id="metronomeBtn">▶ メトロノームで再生</button>
  </div>
  <div class="actions">
    <button class="secondary" id="todayBtn">今日のキーに戻す</button>
  </div>
  <div class="actions">
    <button class="secondary" id="midiBtn" style="background:#fffdf8; color:#8a2d6b; border-color:#8a2d6b;">MIDIファイルを保存 (GarageBand用)</button>
    <p class="status">保存後: GarageBand→ループブラウザ→「ファイル」タブから読み込んでください</p>
  </div>
  <div class="actions">
    <button class="secondary" id="prevBtn">◀ 前のフレーズ</button>
    <button id="nextBtn">次のフレーズ ▶</button>
  </div>

  <details>
    <summary>練習メモ</summary>
    <div>
      1. まずテンポ ♩=60 で全部8分音符。<br>
      2. コードだけを先にアルペジオで確認。<br>
      3. キーを変えて12キー移調。<br>
      4. 最後の小節だけ自分で変奏。<br><br>
      音符の下の小さな数字は、その音が「今鳴っているコードに対して」何度かを表します(グレー=コードトーン、紫=テンション)。同じ音でもコードが変わると数字も変わります。
    </div>
  </details>
</main>

/* ---------- misc helpers (dates / hashing / iReal export) ---------- */
function localYmd(date = new Date()){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");

// Hold the tonic for the 4th bar so displayed/exported measures line up
// 1:1 with the phrase's degree notation.
function practiceBars(chords){

// on screen. Multiple events sharing a bar (e.g. coltrane's ii and V in
// bar 1) are space-joined into that one bar slot.
function irealBarsFromChordPlan(chordPlan){
  const byBar = new Map();
  chordPlan.events.forEach(e => {
    if (!byBar.has(e.barIndex)) byBar.set(e.barIndex, []);
    byBar.get(e.barIndex).push(e);
  });
  const bars = [];
  for (let i = 0; i < chordPlan.totalBars; i++){
    const evs = (byBar.get(i) || []).slice().sort((a, b) => a.beatInBar - b.beatInBar);

// Builds the custom irealbook:// URL documented at
// https://www.irealpro.com/ireal-pro-custom-chord-chart-protocol
function irealUrl(){
  if (!currentPractice) return "";
  const { title, mode, key, chordPlan } = currentPractice;
  const composer = "App Daily251";
  const style = "Medium Swing";
  const keyLabel = irealKeyLabel(mode, key);
  const progression = irealProgressionText(irealBarsFromChordPlan(chordPlan));

/* ---------- theory layer: scale-degree token -> letter/accidental/octave ---------- */
const LETTERS = ['C','D','E','F','G','A','B'];
const NATURAL_PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const MAJOR_STEP_SEMITONES = [0,2,4,5,7,9,11];
// Target register band for flattenPhrase's octave selection, expressed as
// diatonicStep (0 = E4, the bottom staff line). B3 (still just 1 ledger line
// below the staff -- it sits in the space just under the C4 ledger, so it
// costs nothing extra) up to C6 (2 ledger lines above). Widened by exactly
// 1 step on each side versus a plain C4-B5 band: with only [-2,11], the
// letters "B" (candidates step 4, 11) and "C" (candidates step -2, 5) each
// had just one candidate near the register floor/ceiling, so a Cb/B-natural
// note approaching from a neighboring letter one semitone away (e.g. a
// written Cb next to a D, or a B natural resolving down) had no nearby
// same-letter candidate to land on and was forced into a large jump instead
// (this is what caused notes spelled Cb/B to visibly leap in the score).
// Giving B a low-side candidate (B3) and C a high-side candidate (C6) fixes
// that specific enharmonic seam at both edges of the band, at zero added
// ledger cost on the low side and one extra ledger line on the high side
// (still within the "staff + 1-2 ledger lines" target).
const MELODY_MIN_STEP = -3, MELODY_MAX_STEP = 12;

// Handles both flat ("Db") and sharp ("F#") spellings. Practice keys (from
// KEYS) are always flat-spelled, but chord-symbol roots parsed for the
// chord-relative degree display (e.g. "F#m7") can be sharp, so this must
// recognize both.
function parseKeySpelling(keyStr){
  const acc = keyStr[1] === 'b' ? -1 : keyStr[1] === '#' ? 1 : 0;
  return { letter: keyStr[0], acc };
}
function readableSpelling(letter, accidental, targetPc, absLetterIdx){
  if (Math.abs(accidental) <= 1) return { letter, accidental };
  let best = null;
  for (let i = absLetterIdx - 2; i <= absLetterIdx + 2; i++){
    const candidateLetter = LETTERS[((i % 7) + 7) % 7];
    let candidateAccidental = targetPc - NATURAL_PC[candidateLetter];
    if (candidateAccidental > 6) candidateAccidental -= 12;
    if (candidateAccidental < -6) candidateAccidental += 12;
    if (Math.abs(candidateAccidental) > 1) continue;
    const cost = Math.abs(i - absLetterIdx) * 10 + Math.abs(candidateAccidental);
    if (!best || cost < best.cost) best = { letter: candidateLetter, accidental: candidateAccidental, cost };
  }
  return best ? { letter: best.letter, accidental: best.accidental } : { letter, accidental };
}
// Transposes a literal (letter/octave/accidental) note -- as opposed to a
// degree token -- from Key C into any of the 12 KEYS, preserving absolute
// pitch height exactly (diatonic-interval transposition: the letter shifts
// by the same number of diatonic steps as the target key's tonic sits from
// C, and the accidental is whatever makes the resulting pitch correct).
// Used by the "chad_lb" category, whose phrases are stored as literal
// concert-pitch notes transcribed in C rather than as transposable degree
// strings. Falls back to a same-pitch-class respelling (mirroring
// readableSpelling above) on the rare chromatic passing tone that would
// otherwise land on a double-sharp/double-flat in the target key.
function transposeNoteToKey(note, key){
  if (note.rest || key === "C") return note;
  const target = parseKeySpelling(key);
  const letterShift = ((LETTERS.indexOf(target.letter) - LETTERS.indexOf('C')) % 7 + 7) % 7;
  const semitoneShift = KEYS.indexOf(key);
  const origAbsLetterIdx = note.octave * 7 + LETTERS.indexOf(note.letter);
  const origAbsPitch = note.octave * 12 + NATURAL_PC[note.letter] + note.accidental;
  const newAbsLetterIdx = origAbsLetterIdx + letterShift;
  const newAbsPitch = origAbsPitch + semitoneShift;
  let newOctave = Math.floor(newAbsLetterIdx / 7);
  let newLetter = LETTERS[((newAbsLetterIdx % 7) + 7) % 7];
  let newAccidental = newAbsPitch - (newOctave * 12 + NATURAL_PC[newLetter]);
  if (Math.abs(newAccidental) > 1){
    let best = null;
    for (let i = newAbsLetterIdx - 2; i <= newAbsLetterIdx + 2; i++){
      const candOctave = Math.floor(i / 7);
      const candLetter = LETTERS[((i % 7) + 7) % 7];
      const candAccidental = newAbsPitch - (candOctave * 12 + NATURAL_PC[candLetter]);
      if (Math.abs(candAccidental) > 1) continue;
      const cost = Math.abs(i - newAbsLetterIdx) * 10 + Math.abs(candAccidental);
      if (!best || cost < best.cost) best = { letter: candLetter, octave: candOctave, accidental: candAccidental, cost };
    }
    if (best) { newLetter = best.letter; newOctave = best.octave; newAccidental = best.accidental; }

}
function transposeChadLbPhrase(phrase, key){
  const bars = practiceBars(MAJOR_251[key]).map(c => [c]);
  return {
    ...phrase,
    key,
    bars,
    chordsDisplay: practiceBars(MAJOR_251[key]).join(" | "),

// Degree numbers (1-9, 13, optionally b/#-prefixed) are read as major-scale
// steps above the tonic, per this app's existing notation convention.
function degreeLetterAndPc(tonic, token){
  const m = /^([b#]?)([1-9]|13)[v^]?$/.exec(token);
  const alter = m[1] === 'b' ? -1 : m[1] === '#' ? 1 : 0;
  const num = parseInt(m[2], 10);
  const baseNum = num > 7 ? num - 7 : num;                 // 9->2, 13->6
  const stepFromTonic = (baseNum - 1) + (num > 7 ? 7 : 0);  // diatonic steps above tonic

  const tonicLetterIdx = LETTERS.indexOf(tonic.letter);
  const absLetterIdx = tonicLetterIdx + stepFromTonic;
  const letter = LETTERS[((absLetterIdx % 7) + 7) % 7];
  const letterOctaveOffset = Math.floor(absLetterIdx / 7);

  const tonicPc = ((NATURAL_PC[tonic.letter] + tonic.acc) % 12 + 12) % 12;
  const targetPc = ((tonicPc + MAJOR_STEP_SEMITONES[baseNum - 1] + alter) % 12 + 12) % 12;
  let accidental = targetPc - NATURAL_PC[letter];
  if (accidental > 6) accidental -= 12;
  if (accidental < -6) accidental += 12;
  return { ...readableSpelling(letter, accidental, targetPc, absLetterIdx), targetPc };
}
function resolveTonicForSegment(seg, ctx){
  if (seg.tonicRef && seg.tonicRef.centerIndex !== undefined){

  return parseKeySpelling(ctx.key);

// Picks the octave for one note. Only octaves that keep the note inside the
// [MELODY_MIN_STEP, MELODY_MAX_STEP] register band are considered, so the
// letter name/accidental (and therefore its harmonic meaning, e.g. "b5 of
// Bbm7b5") never changes -- only which octave it's placed in. Among the
// in-band candidates, picks whichever is closest to the previous note
// (prevAbs === null for the first note of a phrase, where it instead picks
// the candidate closest to the middle of the staff, B4).
// `bias` (-1/0/+1) shifts which in-band candidate counts as "closest to the
// previous note" by a octave, without changing the candidate set itself (so
// the register-band guarantee still holds) -- used sparingly, per phrase, to
// break a tie away from a candidate that would otherwise force the *next*
// note into a big jump. See degrees strings using a "v"/"^" token suffix.
function pickOctaveInBand(letter, targetPc, prevAbs, bias){
  bias = bias || 0;
  const guess = prevAbs === null ? 4 : Math.round((prevAbs - targetPc) / 12);
  let candidates = [];
  for (let o = guess - 2; o <= guess + 2; o++){
    const step = diatonicStep(letter, o);
    if (step >= MELODY_MIN_STEP && step <= MELODY_MAX_STEP) candidates.push(o);
  }
  if (!candidates.length){
    for (let o = guess - 6; o <= guess + 6; o++){
      const step = diatonicStep(letter, o);
      if (step >= MELODY_MIN_STEP && step <= MELODY_MAX_STEP) candidates.push(o);
    }
  }
  if (prevAbs === null){
    // No previous note yet: anchor to the middle of the staff (step 4 = B4),
    // shifted by a full octave (7 diatonic steps) per unit of bias -- lets a
    // phrase's very first note use "v"/"^" too, not just later notes.
    const anchorStep = 4 + bias * 7;
    return candidates.reduce((best, o) =>
      Math.abs(diatonicStep(letter, o) - anchorStep) < Math.abs(diatonicStep(letter, best) - anchorStep) ? o : best);
  }
  const target = prevAbs + bias * 12;
  return candidates.reduce((best, o) =>
    Math.abs(o * 12 + targetPc - target) < Math.abs(best * 12 + targetPc - target) ? o : best);
}
// Duration suffixes on a degree token (after any b/#, before/around a v/^
// register-bias suffix): none = quarter note (1 beat, every phrase before
// this feature), "e" = eighth note (0.5 beat, written in pairs that together
// fill 1 beat), "t" = triplet eighth (1/3 beat, written in groups of 3 that
// together fill 1 beat), "s" = sixteenth note (0.25 beat, written in groups
// of 2-4 that together fill 1 beat), "q" = 2-beat triplet aka "2拍3連"
// (2/3 beat, written in groups of 3 that together fill 2 beats -- see the
// beam pass in renderScore for how this wider grouping is detected).
// A hold token ("-") can carry the same
// beat instead of the default full beat. "R" is a rest instead of a pitch --
// same duration suffixes apply (e.g. "Re" = eighth rest); a rest followed by
// "-" extends into a longer rest (e.g. "R -" = a half rest) the same way a
// note does.
function parseDurationToken(tok){
  let tied = false;
  if (tok.endsWith('_')) {
    tied = true;
    tok = tok.slice(0, -1);
  }
  if (tok.endsWith('d')) return { base: tok.slice(0, -1), duration: 0.125, tied };
  if (tok.endsWith('e')) return { base: tok.slice(0, -1), duration: 0.5, tied };
  if (tok.endsWith('t')) return { base: tok.slice(0, -1), duration: 1 / 3, tied };
  if (tok.endsWith('s')) return { base: tok.slice(0, -1), duration: 0.25, tied };
  // "q" = 2拍3連(4分音符3連符)の1音。2拍にまたがる3連符なので1音は2/3拍。
  if (tok.endsWith('q')) return { base: tok.slice(0, -1), duration: 2 / 3, tied };

// Expands a phrase's degree text into a flat list of notes, each carrying its
// bar index, its position within that bar (in beats, possibly fractional for
// eighths/triplets) and its duration (in beats). Each new (non-hold) note
// picks whichever in-band octave lands closest to the previous note's pitch,
// so e.g. "1 6 4 2" actually descends instead of always resolving upward,
// while staying inside the readable register band. A hold token extends the
// previous note's duration instead of starting a new note.
function flattenPhrase(phrase, ctx){
  const segments = phrase.segments || [{ tonicRef: "self", degrees: phrase.degrees }];
  const cautionaryNaturals = new Set(phrase.cautionaryNaturals || []);
  let noteOrdinal = 0;
  let prevAbs = null;
  let barOffset = 0;
  const notes = [];
  segments.forEach(seg => {
    const tonic = resolveTonicForSegment(seg, ctx);
    const bars = seg.degrees.split("|");
    bars.forEach((barStr, localBarIndex) => {
      const barIndex = barOffset + localBarIndex;
      let beatInBar = 0;
      barStr.trim().split(/\s+/).forEach(tok => {
        const { base, duration, tied } = parseDurationToken(tok);
        if (base === "-") {
          if (notes.length) notes[notes.length - 1].duration += duration;
          beatInBar += duration;
          return;
        }
        if (base === "R") {
          notes.push({ barIndex, beatInBar, duration, rest: true });
          beatInBar += duration;
          return;
        }
        const bias = base.endsWith('v') ? -1 : base.endsWith('^') ? 1 : 0;
        const d = degreeLetterAndPc(tonic, base);
        const octave = pickOctaveInBand(d.letter, d.targetPc, prevAbs, bias);
        prevAbs = octave * 12 + d.targetPc;
        const natural = cautionaryNaturals.has(noteOrdinal);
        notes.push({ barIndex, beatInBar, duration, letter: d.letter, accidental: d.accidental, octave, natural, tied });
        noteOrdinal += 1;
        beatInBar += duration;
      });
    });
    barOffset += bars.length;
  });
  return notes;
}

/* ---------- chord-relative degree labels (task 4) ---------- */
// [degreeName, isChordTone] for each semitone offset (0-11) above the chord
// root, one table per chord quality actually used by this app's chord
// dictionaries (all derived from MAJOR_251/MINOR_251, so only maj7/m7/m7b5/
// m6/7/7alt ever appear as a chord label suffix).
const QUALITY_DEGREE_TABLE = {
  "7":    [["1",true],["b9",false],["9",false],["#9",false],["3",true],["11",false],["#11",false],["5",true],["b13",false],["13",false],["b7",true],["7",false]],
  "maj7": [["1",true],["b9",false],["9",false],["#9",false],["3",true],["11",false],["#11",false],["5",true],["#5",false],["13",false],["b7",false],["7",true]],
  "m7":   [["1",true],["b9",false],["9",false],["b3",true],["3",false],["11",false],["#11",false],["5",true],["b13",false],["13",false],["b7",true],["7",false]],
  "m7b5": [["1",true],["b9",false],["9",false],["b3",true],["3",false],["11",false],["b5",true],["5",false],["b13",false],["13",false],["b7",true],["7",false]],
  "m6":   [["1",true],["b9",false],["9",false],["b3",true],["3",false],["11",false],["#11",false],["5",true],["b13",false],["6",true],["b7",false],["7",false]]

function parseChordSymbolQuality(label){
  const m = /^([A-G][b#]?)(.*)$/.exec(label);
  const rest = m[2];
  let quality = "7"; // dominant is the fallback: also covers "7alt" (same tension spellings as plain 7)
  if (rest === "maj7") quality = "maj7";
  else if (rest === "m7b5") quality = "m7b5";
  else if (rest === "m6") quality = "m6";
  else if (rest === "m7") quality = "m7";
  return { rootStr: m[1], quality };
}
// Finds the chord sounding under a note (same bar, latest chord event at or
// before the note's own beat position) -- every bar has an event at
// beatInBar 0, so this always finds a match.
function activeChordForNote(note, chordPlan){
  return chordPlan.events
    .filter(e => e.barIndex === note.barIndex && e.beatInBar <= note.beatInBar + 1e-6)
    .reduce((best, e) => (!best || e.beatInBar > best.beatInBar) ? e : best, null);
}
// Phrase degrees are written relative to the tonic (see degreeLetterAndPc),
// but the on-screen label needed here is relative to whichever chord is
// sounding, e.g. a tonic-relative "b6" reads as "b9" while V7 is sounding.
function chordRelativeDegree(note, chordEvent){
  const { rootStr, quality } = parseChordSymbolQuality(chordEvent.label);
  const root = parseKeySpelling(rootStr);
  const rootPc = ((NATURAL_PC[root.letter] + root.acc) % 12 + 12) % 12;
  const notePc = ((NATURAL_PC[note.letter] + note.accidental) % 12 + 12) % 12;
  const offset = ((notePc - rootPc) % 12 + 12) % 12;
  const [name, isChordTone] = QUALITY_DEGREE_TABLE[quality][offset];
  return { name, isChordTone };
}

/* ---------- SVG score rendering (pure geometry, no music theory) ---------- */
const BEAT_W = 40, STAFF_LEFT = 32, BARS_PER_ROW = 2, BEATS_PER_BAR = 4;
const HALF_GAP = 4, ROW_H = 110, STAFF_TOP0 = 50, NOTE_RX = 5, NOTE_RY = 4, STEM_LEN = 26;
const INK = "#201f1b", MUTED = "#6f665b";
const LETTER_ORD = {C:0,D:1,E:2,F:3,G:4,A:5,B:6};
// Degree-label row (task 4): fixed offset below staffTopY rather than
// relative to each note's own height, so labels stay in one tidy line
// regardless of pitch -- 62px clears the lowest note in the register band
// (MELODY_MIN_STEP, with its ledger line) by a comfortable margin.
const DEGREE_LABEL_Y = 62, DEGREE_LABEL_SIZE = 9.5, DEGREE_LABEL_SIZE_DENSE = 7.5, DEGREE_TENSION_COLOR = "#8a2d6b";
const BEAM_Y_PAD = 4; // extra stem length beyond STEM_LEN so beams clear noteheads of varying pitch
const BEAM2_OFFSET = 5; // gap between the primary (eighth-level) beam and a secondary (sixteenth-level) partial beam

function yForStep(step, staffTopY){ return staffTopY + (8 - step) * HALF_GAP; }
function ledgerSteps(step){
  const out = [];
  if (step > 8) for (let s = 10; s <= step; s += 2) out.push(s);
  else if (step < 0) for (let s = -2; s >= step; s -= 2) out.push(s);
  return out;
}
function diatonicStep(letter, octave){
  const ord = octave * 7 + LETTER_ORD[letter];

  return ord - ordE4;
}
function escapeXml(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function renderScore(notes, chordPlan, phrase){
  const totalBars = chordPlan.totalBars;
  const rows = Math.ceil(totalBars / BARS_PER_ROW);
  const svgW = STAFF_LEFT + BARS_PER_ROW * BEATS_PER_BAR * BEAT_W + 16;
  const svgH = STAFF_TOP0 + Math.max(0, rows - 1) * ROW_H + 86;

  let svg = `<svg viewBox="0 0 ${svgW} ${svgH}" width="100%" xmlns="http://www.w3.org/2000/svg">`;

  for (let row = 0; row < rows; row++){
    const staffTopY = STAFF_TOP0 + row * ROW_H;
    const barStart = row * BARS_PER_ROW;
    const barsInRow = Math.min(BARS_PER_ROW, totalBars - barStart);
    const rowBarEnd = barStart + barsInRow;
    const rowRight = STAFF_LEFT + barsInRow * BEATS_PER_BAR * BEAT_W;

    for (let li = 0; li < 5; li++){
      const y = staffTopY + li * HALF_GAP * 2;
      svg += `<line x1="${STAFF_LEFT - 6}" x2="${rowRight + 8}" y1="${y}" y2="${y}" stroke="${MUTED}" stroke-width="1"/>`;
    }
    svg += `<text x="${STAFF_LEFT - 26}" y="${staffTopY + 26}" font-size="28" fill="${INK}">\u{1D11E}</text>`;
    for (let bi = 0; bi <= barsInRow; bi++){
      const x = STAFF_LEFT + bi * BEATS_PER_BAR * BEAT_W;
      svg += `<line x1="${x}" x2="${x}" y1="${staffTopY}" y2="${staffTopY + 32}" stroke="${INK}" stroke-width="${bi === barsInRow ? 2 : 1}"/>`;
    }
    chordPlan.events.filter(e => e.barIndex >= barStart && e.barIndex < rowBarEnd).forEach(e => {
      const localBeat = (e.barIndex - barStart) * BEATS_PER_BAR + e.beatInBar;
      const x = STAFF_LEFT + localBeat * BEAT_W;
      const color = CHORD_COLORS[e.fn] || INK;
      svg += `<text x="${x}" y="${staffTopY - 10}" font-size="14" font-weight="700" fill="${color}">${escapeXml(e.label)}</text>`;
    });

    // Rest pass: eighth/quarter/half rest glyphs. Rests carry no pitch, so
    // they're kept out of the notehead/geo pass below (and out of beaming --
    // a rest never shares a beam with a note).
    const restY = yForStep(4, staffTopY); // middle staff line (B4), the shared anchor for all rest glyphs
    notes.filter(n => n.rest && n.barIndex >= barStart && n.barIndex < rowBarEnd).forEach(n => {
      const localBeat = (n.barIndex - barStart) * BEATS_PER_BAR + n.beatInBar;
      const cx = STAFF_LEFT + localBeat * BEAT_W + (n.duration * BEAT_W) / 2;
      if (n.duration < 1 - 1e-6){
        // eighth rest: small hooked flag with a dot, floating above center
        svg += `<circle cx="${cx + 2}" cy="${restY - 6}" r="2.2" fill="${INK}"/>`;
        svg += `<path d="M${cx + 2} ${restY - 6} Q${cx - 2} ${restY - 2} ${cx + 3} ${restY + 2} Q${cx - 3} ${restY + 6} ${cx + 1} ${restY + 10}" fill="none" stroke="${INK}" stroke-width="1.4"/>`;
      } else if (n.duration < 1.5 + 1e-6){
        // quarter rest: zigzag squiggle centered on the middle line
        svg += `<path d="M${cx - 3} ${restY - 10} L${cx + 3} ${restY - 3} L${cx - 4} ${restY} L${cx + 3} ${restY + 4} L${cx - 3} ${restY + 10}" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;
      } else {
        // half rest: filled rectangle sitting on top of the middle line
        // (distinct from a whole rest, which hangs below the line above)
        svg += `<rect x="${cx - 5}" y="${restY - 4}" width="10" height="4" fill="${INK}"/>`;
      }
    });

    // Notehead / ledger / accidental / tie-sustain / degree-label pass, plus
    // per-note geometry cached for the beam pass below.
    const rowNotes = notes.filter(n => n.barIndex >= barStart && n.barIndex < rowBarEnd && !n.rest);
    const geo = new Map();
    let prevNoteCx = -Infinity;
    rowNotes.forEach(n => {
      const localBeat = (n.barIndex - barStart) * BEATS_PER_BAR + n.beatInBar;
      const cx = STAFF_LEFT + localBeat * BEAT_W + (n.duration * BEAT_W) / 2;
      const step = diatonicStep(n.letter, n.octave);
      const y = yForStep(step, staffTopY);
      ledgerSteps(step).forEach(s => {
        const ly = yForStep(s, staffTopY);
        svg += `<line x1="${cx - 8}" x2="${cx + 8}" y1="${ly}" y2="${ly}" stroke="${INK}" stroke-width="1"/>`;
      });
      if (n.duration > 1 + 1e-6){
        const holdEndX = STAFF_LEFT + (localBeat + n.duration) * BEAT_W - 6;
        svg += `<line x1="${cx + 7}" x2="${holdEndX}" y1="${y}" y2="${y}" stroke="${INK}" stroke-width="2"/>`;
      }
      const opacity = n.tied ? 0.35 : 1;
      if (n.accidental || n.natural){
        // 直前の音符との間隔が狭い(8分音符以降の密なパッセージ)ときは
        // 固定サイズのまま描くと音符・臨時記号同士が重なるため、
        // 間隔に応じて臨時記号を縮小・位置調整して重なりを避ける。
        const gapToPrev = cx - prevNoteCx;
        let accSize = 22, accOffset = 19;
        if (gapToPrev < 16){ accSize = 12; accOffset = 9; }
        else if (gapToPrev < 24){ accSize = 15; accOffset = 12; }
        else if (gapToPrev < 34){ accSize = 18; accOffset = 15; }
        const glyph = n.accidental < 0 ? "♭" : n.accidental > 0 ? "♯" : "♮";
        svg += `<text x="${cx - accOffset}" y="${y + 7}" font-size="${accSize}" font-weight="700" fill="${INK}" opacity="${opacity}">${glyph}</text>`;
      }
      svg += `<ellipse cx="${cx}" cy="${y}" rx="${NOTE_RX}" ry="${NOTE_RY}" fill="${INK}" opacity="${opacity}"/>`;
      prevNoteCx = cx;

      const chordEvent = activeChordForNote(n, chordPlan);
      if (chordEvent){
        const { name, isChordTone } = chordRelativeDegree(n, chordEvent);
        const color = isChordTone ? MUTED : DEGREE_TENSION_COLOR;
        const labelSize = n.duration < 0.6 ? DEGREE_LABEL_SIZE_DENSE : DEGREE_LABEL_SIZE;
        svg += `<text x="${cx}" y="${staffTopY + DEGREE_LABEL_Y}" font-size="${labelSize}" font-weight="700" fill="${color}" text-anchor="middle" opacity="${opacity}">${escapeXml(name)}</text>`;
      }

      geo.set(n, { cx, y, step });

      if (n.tied) {
        const prevNoteIdx = rowNotes.indexOf(n) - 1;
        if (prevNoteIdx >= 0) {
          const p = rowNotes[prevNoteIdx];
          const pGeo = geo.get(p);
          if (pGeo) {
            const x1 = pGeo.cx;
            const y1 = pGeo.y;
            const x2 = cx;
            const y2 = y;
            
            const avgStep = (pGeo.step + step) / 2;
            const tieUp = avgStep < 4;
            
            const mx = (x1 + x2) / 2;
            const offset = tieUp ? 10 : -10;
            const my = (y1 + y2) / 2 + offset;
            
            const startX = x1 + 4;
            const startY = y1 + (tieUp ? 4 : -4);
            const endX = x2 - 4;
            const endY = y2 + (tieUp ? 4 : -4);
            
            svg += `<path d="M ${startX} ${startY} Q ${mx} ${my} ${endX} ${endY}" fill="none" stroke="${INK}" stroke-width="1.2" stroke-linecap="round"/>`;
          }
        }
      }
    });

    // Stem pass: plain full-length stems for quarter notes (and longer held
    // notes) as before. Notes shorter than a beat (eighths/triplets) are
    // collected per beat below and beamed instead, so their stems are drawn
    // there -- skip them here.
    rowNotes.forEach(n => {
      if (n.duration < 1 - 1e-6) return;
      const { cx, y, step } = geo.get(n);
      const stemUp = step < 4;
      const stemX = stemUp ? cx + NOTE_RX - 1 : cx - NOTE_RX + 1;
      const stemY2 = stemUp ? y - STEM_LEN : y + STEM_LEN;
      svg += `<line x1="${stemX}" x2="${stemX}" y1="${y}" y2="${stemY2}" stroke="${INK}" stroke-width="1.4"/>`;
    });

    // Beam pass: group same-bar, same-beat notes shorter than 1 beat (eighth
    // pairs, triplet eighths, sixteenth runs) and connect their stems with
    // one primary beam bar. A consecutive run of sixteenth notes (duration
    // 0.25) within that group additionally gets a second, shorter partial
    // beam offset toward the noteheads, matching how mixed eighth+sixteenth
    // beat groups (e.g. eighth + two sixteenths) are notated on paper. A true
    // triplet (exactly 3 notes, each 1/3 beat) also gets a small "3" over the
    // beam -- checked by duration, not just by count, so an incidental
    // 3-note eighth/sixteenth group (e.g. eighth + sixteenth + sixteenth)
    // isn't mistaken for a triplet. An isolated short note (no group
    // partner) falls back to a single flag (double flag if it's a
    // sixteenth) -- not produced by any phrase in this app today, but kept
    // so a future mis-authored phrase degrades gracefully instead of
    // drawing nothing. A lone sixteenth inside an otherwise non-sixteenth
    // group (no adjacent sixteenth to pair the partial beam with) isn't
    // handled specially and simply gets no partial beam -- not produced by
    // any phrase in this app today either.
    for (let bi = barStart; bi < rowBarEnd; bi++){
      const barBeamSize = (phrase && phrase.beamSizes && phrase.beamSizes[bi] !== undefined)
        ? phrase.beamSizes[bi]
        : 2;
      let beatIdx = 0;
      while (beatIdx < BEATS_PER_BAR){
        // 2拍3連("q"、2/3拍)は2拍にまたがる3連符なので、通常の1拍単位の判定より
        // 先に2拍分の窓でまとめて拾う。見つかったらその2拍をまるごと1グループにする。
        const twoBeatTriplet = rowNotes.filter(n => n.barIndex === bi &&
          Math.abs(n.duration - 2/3) < 1e-6 &&
          n.beatInBar >= beatIdx - 1e-6 && n.beatInBar < beatIdx + 2 - 1e-6)
          .sort((a, b) => a.beatInBar - b.beatInBar);
        const stepSize = (barBeamSize === 4 && beatIdx % 2 === 0) ? 2 : 1;
        const nextNotes = rowNotes.filter(n => n.barIndex === bi && n.duration < 1 - 1e-6 &&
          n.beatInBar >= beatIdx - 1e-6 && n.beatInBar < beatIdx + stepSize - 1e-6);
        const hasTriplet = nextNotes.some(n => Math.abs(n.duration - 1/3) < 1e-6);
        const hasSixteenth = nextNotes.some(n => n.duration < 0.25 + 1e-6);
        const actualStepSize = twoBeatTriplet.length ? 2 : (hasTriplet || hasSixteenth) ? 1 : stepSize;

        const group = twoBeatTriplet.length ? twoBeatTriplet : rowNotes.filter(n => n.barIndex === bi && n.duration < 1 - 1e-6 &&
          n.beatInBar >= beatIdx - 1e-6 && n.beatInBar < beatIdx + actualStepSize - 1e-6)
          .sort((a, b) => a.beatInBar - b.beatInBar);
        if (!group.length) {
          beatIdx += actualStepSize;
          continue;
        }
        const avgStep = group.reduce((sum, n) => sum + geo.get(n).step, 0) / group.length;
        const stemUp = avgStep < 4;
        const isSixteenth = n => n.duration < 0.25 + 1e-6;
        if (group.length === 1){
          const { cx, y } = geo.get(group[0]);
          const stemX = stemUp ? cx + NOTE_RX - 1 : cx - NOTE_RX + 1;
          const stemY2 = stemUp ? y - STEM_LEN : y + STEM_LEN;
          svg += `<line x1="${stemX}" x2="${stemX}" y1="${y}" y2="${stemY2}" stroke="${INK}" stroke-width="1.4"/>`;
          const flagY2 = stemUp ? stemY2 + 10 : stemY2 - 10;
          svg += `<path d="M${stemX} ${stemY2} Q${stemX + 8} ${(stemY2 + flagY2) / 2} ${stemX + 6} ${flagY2}" fill="none" stroke="${INK}" stroke-width="1.4"/>`;
          if (isSixteenth(group[0])){
            const flagY2b = stemUp ? stemY2 + 17 : stemY2 - 17;
            const midY2b = stemUp ? (stemY2 + 7 + flagY2b) / 2 : (stemY2 - 7 + flagY2b) / 2;
            svg += `<path d="M${stemX} ${stemUp ? stemY2 + 7 : stemY2 - 7} Q${stemX + 8} ${midY2b} ${stemX + 6} ${flagY2b}" fill="none" stroke="${INK}" stroke-width="1.4"/>`;
          }
          beatIdx += actualStepSize;
          continue;
        }
        const beamY = stemUp
          ? Math.min(...group.map(n => geo.get(n).y)) - STEM_LEN - BEAM_Y_PAD
          : Math.max(...group.map(n => geo.get(n).y)) + STEM_LEN + BEAM_Y_PAD;
        group.forEach(n => {
          const { cx, y } = geo.get(n);
          const stemX = stemUp ? cx + NOTE_RX - 1 : cx - NOTE_RX + 1;
          svg += `<line x1="${stemX}" x2="${stemX}" y1="${y}" y2="${beamY}" stroke="${INK}" stroke-width="1.4"/>`;
        });
        const firstX = (stemUp ? geo.get(group[0]).cx + NOTE_RX - 1 : geo.get(group[0]).cx - NOTE_RX + 1);
        const lastX = (stemUp ? geo.get(group[group.length - 1]).cx + NOTE_RX - 1 : geo.get(group[group.length - 1]).cx - NOTE_RX + 1);
        svg += `<line x1="${firstX}" x2="${lastX}" y1="${beamY}" y2="${beamY}" stroke="${INK}" stroke-width="3"/>`;
        const isTriplet = group.length === 3 &&
          (group.every(n => Math.abs(n.duration - 1 / 3) < 1e-6) || group.every(n => Math.abs(n.duration - 2 / 3) < 1e-6));
        if (isTriplet){
          const midX = (firstX + lastX) / 2;
          const numY = stemUp ? beamY - 6 : beamY + 12;
          svg += `<text x="${midX}" y="${numY}" font-size="12" font-style="italic" fill="${INK}" text-anchor="middle">3</text>`;
        }
        const beamY2 = stemUp ? beamY + BEAM2_OFFSET : beamY - BEAM2_OFFSET;
        let runStart = null;
        for (let i = 0; i <= group.length; i++){
          const inRun = i < group.length && isSixteenth(group[i]);
          if (inRun && runStart === null) runStart = i;
          if ((!inRun || i === group.length) && runStart !== null){
            const runEnd = i - 1;
            if (runEnd > runStart){
              const x1 = stemUp ? geo.get(group[runStart]).cx + NOTE_RX - 1 : geo.get(group[runStart]).cx - NOTE_RX + 1;
              const x2 = stemUp ? geo.get(group[runEnd]).cx + NOTE_RX - 1 : geo.get(group[runEnd]).cx - NOTE_RX + 1;
              svg += `<line x1="${x1}" x2="${x2}" y1="${beamY2}" y2="${beamY2}" stroke="${INK}" stroke-width="3"/>`;
            }
            runStart = null;
          }
        }
        const BEAM3_OFFSET = 10;
        const beamY3 = stemUp ? beamY + BEAM3_OFFSET : beamY - BEAM3_OFFSET;
        const isThirtySecond = n => n.duration < 0.125 + 1e-6;
        let runStart3 = null;
        for (let i = 0; i <= group.length; i++){
          const inRun = i < group.length && isThirtySecond(group[i]);
          if (inRun && runStart3 === null) runStart3 = i;
          if ((!inRun || i === group.length) && runStart3 !== null){
            const runEnd = i - 1;
            if (runEnd > runStart3){
              const x1 = stemUp ? geo.get(group[runStart3]).cx + NOTE_RX - 1 : geo.get(group[runStart3]).cx - NOTE_RX + 1;
              const x2 = stemUp ? geo.get(group[runEnd]).cx + NOTE_RX - 1 : geo.get(group[runEnd]).cx - NOTE_RX + 1;
              svg += `<line x1="${x1}" x2="${x2}" y1="${beamY3}" y2="${beamY3}" stroke="${INK}" stroke-width="3"/>`;
            }
            runStart3 = null;
          }
        }
        beatIdx += actualStepSize;
      }
    }
  }
  svg += `</svg>`;
  document.getElementById("score").innerHTML = svg;
}

/* ---------- chord-plan builder (per category) ---------- */
function barsToPlan(bars, fns){
  return { events: bars.map((label, i) => ({ barIndex: i, beatInBar: 0, label, fn: fns[i] })), totalBars: bars.length };
}
// Original-book phrases already list literal chords per bar (possibly more
// than one per bar), unlike the degree-templated categories above.
function chordPlanFromBars(bars){
  const events = [];
  bars.forEach((barChords, i) => {
    barChords.forEach((label, j) => events.push({ barIndex: i, beatInBar: j, label, fn: null }));
  });
  return { events, totalBars: bars.length };
}
function getChordPlan(category, variant, key, phrase){
  if (category === "diatonic"){
    const isMinor = variant === "minor";
    const chords = (isMinor ? MINOR_251 : MAJOR_251)[key];
    const bars = practiceBars(chords);
    const fns = isMinor ? ["dim","V","I","I"] : ["ii","V","I","I"];
    return barsToPlan(bars, fns);
  }
  if (category === "net_original" && variant === "minor"){
    const bars = practiceBars(MINOR_251[key]);
    return barsToPlan(bars, ["dim","V","I","I"]);
  }
  if (category === "approach" || category === "bebop" || category === "chromatic_tension" || category === "net_original"){
    const bars = practiceBars(MAJOR_251[key]);
    return barsToPlan(bars, ["ii","V","I","I"]);
  }
  if (category === "turnaround"){
    const dict = TURNAROUND_DICTS[variant] || TURNAROUND_BASIC;
    const bars = dict[key];
    const fns = TURNAROUND_FUNCS[variant] || TURNAROUND_FUNCS.basic;
    return barsToPlan(bars, fns);
  }
  if (category === "coltrane"){
    const centers = COLTRANE_CENTERS[key];
    const events = [];
    centers.forEach((center, i) => {
      const [ii, V, I] = MAJOR_251[center];
      events.push({ barIndex: i * 2, beatInBar: 0, label: ii, fn: "ii" });
      events.push({ barIndex: i * 2, beatInBar: 2, label: V, fn: "V" });
      events.push({ barIndex: i * 2 + 1, beatInBar: 0, label: I, fn: "I" });
    });
    return { events, totalBars: centers.length * 2 };
  }
  if (category === "blues"){
    const isMinor = variant === "minor";
    const bars = (isMinor ? BLUES_MINOR : BLUES_MAJOR)[key];
    const fns = isMinor ? BLUES_MINOR_FNS : BLUES_MAJOR_FNS;
    return barsToPlan(bars, fns);
  }
  if (category === "vamp"){
    const chordLabel = variant === "major7" ? `${key}maj7` : `${key}7`;
    return barsToPlan(Array(4).fill(chordLabel), ["I","I","I","I"]);
  }
  if (category === "inaya"){
    const dict = (phrase && phrase.chordsDict) || INAYA_CHORDS;
    const fnUnit = (phrase && phrase.chordsFns) || ["I","vi","IV","V"];
    const reps = ((phrase && phrase.bars) || 16) / 4;
    const unit = dict[key];
    const bars = [];
    const fns = [];
    for (let i = 0; i < reps; i++){ bars.push(...unit); fns.push(...fnUnit); }
    return barsToPlan(bars, fns);
  }
  return barsToPlan(practiceBars(MAJOR_251[key]), ["ii","V","I","I"]);
}
// XMLインポート曲は他カテゴリと違いdata/*.jsonから非同期で読み込む。
// ユーザーが今後もXMLファイルを増やしていく運用のため、index.htmlを
// 書き換えずにJSONを追加するだけで反映できるようにするための設計。
let XML_PHRASES = [];
let xmlPhrasesLoadPromise = null;
function loadXmlPhrases(){
  return fetch("data/xml_scores/manifest.json")
    .then(res => res.ok ? res.json() : [])
    .then(manifest => Promise.all(manifest.map(entry =>
      fetch(`data/xml_scores/${entry.file}`).then(res => res.json())
    )))
    .then(tunes => { XML_PHRASES = tunes; })
    .catch(() => { XML_PHRASES = []; });
}
function ensureXmlPhrasesLoaded(){
  if (!xmlPhrasesLoadPromise) xmlPhrasesLoadPromise = loadXmlPhrases();
  return xmlPhrasesLoadPromise;
}
function getPhrasePool(category, variant){
  if (category === "diatonic") return variant === "minor" ? MINOR_PHRASES : MAJOR_PHRASES;
  if (category === "approach") return APPROACH_PHRASES;
  if (category === "bebop") return BEBOP_PHRASES;
  if (category === "turnaround") return TURNAROUND_PHRASES[variant] || TURNAROUND_PHRASES.basic;
  if (category === "coltrane") return COLTRANE_PHRASES;
  if (category === "blues") return variant === "minor" ? BLUES_MINOR_PHRASES : BLUES_MAJOR_PHRASES;
  if (category === "vamp") return variant === "major7" ? MAJOR7_VAMP_PHRASES : DOMINANT_VAMP_PHRASES;
  if (category === "original") return ORIGINAL_PHRASES;
  if (category === "inaya") return INAYA_PHRASES;
  if (category === "chad_lb") return CHAD_LB_PHRASES;
  if (category === "xml") return XML_PHRASES;
  if (category === "chromatic_tension") return CHROMATIC_TENSION_PHRASES;
  if (category === "net_original") return variant === "minor" ? NET_ORIGINAL_MINOR_PHRASES : NET_ORIGINAL_PHRASES;
  if (category === "rhythm") return RHYTHM_PHRASES;
  return MAJOR_PHRASES;
}

const modeSelect = document.getElementById("mode");
const keySelect = document.getElementById("key");
KEYS.forEach(k => keySelect.add(new Option(k, k)));
const modeField = document.getElementById("modeField");
const keyField = document.getElementById("keyField");

let currentIndex = 0;
let currentPractice = null;

function updateModeSelect(category){
  modeSelect.innerHTML = "";
  keyField.style.display = "";

    modeSelect.add(new Option("Major 251","major"));
    modeSelect.add(new Option("Minor 251","minor"));
    modeField.style.display = "";
    keyField.classList.remove("full");
  } else if (category === "turnaround"){
    modeSelect.add(new Option("基本形","basic"));
    modeSelect.add(new Option("iii7代理","iiisub"));
    modeSelect.add(new Option("裏コード","tritone"));
    modeSelect.add(new Option("マイナー化","minorized"));
    modeField.style.display = "";
    keyField.classList.remove("full");
  } else if (category === "blues"){
    modeSelect.add(new Option("Major Blues","major"));
    modeSelect.add(new Option("Minor Blues","minor"));
    modeField.style.display = "";
    keyField.classList.remove("full");
  } else if (category === "vamp"){
    modeSelect.add(new Option("Dominant7 Vamp","dominant7"));
    modeSelect.add(new Option("Major7 Vamp","major7"));
    modeField.style.display = "";
    keyField.classList.remove("full");
  } else if (category === "net_original"){
    modeSelect.add(new Option("Major 251","major"));
    modeSelect.add(new Option("Minor 251","minor"));
    modeField.style.display = "";
    keyField.classList.remove("full");
  } else if (category === "original"){
    // Fixed literal chords per phrase -- no mode/key to choose; navigation
    // is entirely via the prev/next phrase buttons.
    modeField.style.display = "none";
    keyField.style.display = "none";
  } else if (category === "inaya"){
    // Fixed I-vi-IV-V progression, no mode to choose, but transposable to any key.
    modeField.style.display = "none";
    keyField.style.display = "";
    keyField.classList.add("full");
  } else if (category === "chad_lb"){
    // Fixed ii-V-I-I progression, no mode to choose, but transposable to any key.
    modeField.style.display = "none";
    keyField.style.display = "";
    keyField.classList.add("full");
  } else if (category === "xml"){
    // Fixed literal chords per tune -- no mode/key to choose; navigation
    // is entirely via the prev/next phrase buttons.
    modeField.style.display = "none";
    keyField.style.display = "none";
  } else {
    modeField.style.display = "none";
    keyField.style.display = "";
    keyField.classList.add("full");
  }
}
function seedIndex(category, variant, key){
  const pool = getPhrasePool(category, variant);
  if (!pool.length) return 0;
  const today = localYmd();
  return hashString(`${today}-${category}-${variant}-${key}`) % pool.length;
}
async function render(){
  const category = categorySelect.value;
  const key = keySelect.value;
  const variant = modeSelect.value;
  if (category === "xml") await ensureXmlPhrasesLoaded();
  const pool = getPhrasePool(category, variant);
  if (!pool.length || currentIndex >= pool.length) currentIndex = 0;
  const phrase = pool[currentIndex];
  const today = localYmd();
  const catLabel = CATEGORIES.find(c => c.id === category).label;

  document.getElementById("prevBtn").disabled = pool.length <= 1;
  document.getElementById("nextBtn").disabled = pool.length <= 1;
  document.getElementById("irealSection").style.display = "";
  document.getElementById("irealStatus").textContent = "";

  if (category === "original"){
    const chordPlan = chordPlanFromBars(phrase.bars);
    renderScore(phrase.notes, chordPlan, phrase);
    currentNotes = phrase.notes;
    const numLabel = `#${String(phrase.number).padStart(2, "0")}`;
    document.getElementById("dateLine").textContent = `${today} / ${catLabel} ${numLabel} / Key: ${phrase.key}`;
    document.getElementById("phraseName").textContent = `${ORIGINAL_SOURCE_TITLE} ${numLabel}`;
    document.getElementById("tip").textContent = phrase.chordsDisplay;
    currentPractice = {
      title: `${ORIGINAL_SOURCE_TITLE} ${numLabel}`,
      mode: "Original",
      key: phrase.key,
      chordPlan
    };
    return;
  }

  if (category === "xml"){
    if (!phrase){
      document.getElementById("dateLine").textContent = `${today} / ${catLabel}`;
      document.getElementById("phraseName").textContent = "XMLファイルがまだ登録されていません";
      document.getElementById("tip").textContent = "";
      currentNotes = [];
      currentPractice = null;
      return;
    }
    const chordPlan = chordPlanFromBars(phrase.bars);
    renderScore(phrase.notes, chordPlan, phrase);
    currentNotes = phrase.notes;
    document.getElementById("dateLine").textContent = `${today} / ${catLabel} / Key: ${phrase.key}`;
    document.getElementById("phraseName").textContent = phrase.title;
    document.getElementById("tip").textContent = phrase.chordsDisplay;
    currentPractice = {
      title: phrase.title,
      mode: "Original",
      key: phrase.key,
      chordPlan
    };
    return;
  }

  if (category === "chad_lb"){
    const transposed = transposeChadLbPhrase(phrase, key);
    const chordPlan = chordPlanFromBars(transposed.bars);
    renderScore(transposed.notes, chordPlan, transposed);
    currentNotes = transposed.notes;
    const numLabel = `#${String(phrase.number).padStart(2, "0")}`;
    document.getElementById("dateLine").textContent = `${today} / ${catLabel} ${numLabel} / Key: ${key}`;
    document.getElementById("phraseName").textContent = `${CHAD_LB_SOURCE_TITLE} ${numLabel}`;
    document.getElementById("tip").textContent = transposed.chordsDisplay;
    currentPractice = {
      title: `${CHAD_LB_SOURCE_TITLE} ${numLabel} ${key}`,
      mode: "Major",
      key,
      chordPlan
    };
    return;
  }

  if (category === "inaya"){
    const chordPlan = getChordPlan(category, variant, key, phrase);
    const beats = flattenPhrase(phrase, { key });
    renderScore(beats, chordPlan, phrase);
    currentNotes = beats;
    const numLabel = `#${String(phrase.number).padStart(2, "0")}`;
    const dict = phrase.chordsDict || INAYA_CHORDS;
    const totalBars = phrase.bars || 16;
    const chordsDisplay = `${dict[key].join(" - ")} （${totalBars / 4}回・全${totalBars}小節）`;
    document.getElementById("dateLine").textContent = `${today} / ${catLabel} ${numLabel} / Key: ${key}`;
    document.getElementById("phraseName").textContent = `${INAYA_SOURCE_TITLE} ${numLabel}`;
    document.getElementById("tip").textContent = chordsDisplay;
    currentPractice = {
      title: `${INAYA_SOURCE_TITLE} ${numLabel} ${key}`,
      mode: "Major",
      key,
      chordPlan
    };
    return;
  }

  const chordPlan = getChordPlan(category, variant, key);
  const beats = flattenPhrase(phrase, { key });
  renderScore(beats, chordPlan, phrase);
  currentNotes = beats;

  document.getElementById("dateLine").textContent = `${today} / Key: ${key} / ${catLabel}`;
  document.getElementById("phraseName").textContent = phrase.name;
  document.getElementById("tip").textContent = phrase.tip;

  const TURNAROUND_LABEL = { basic:"基本形", iiisub:"iii7代理", tritone:"裏コード", minorized:"マイナー化" };
  const titleByCategory = {
    diatonic: `Daily 251 ${variant === "minor" ? "Minor" : "Major"} ${key}`,
    approach: `Daily 251 Approach ${key}`,
    bebop: `Daily 251 Bebop ${key}`,
    turnaround: `Daily 251 Turnaround ${TURNAROUND_LABEL[variant] || "基本形"} ${key}`,
    coltrane: `Daily 251 Coltrane ${key}`,
    blues: `Daily Blues ${variant === "minor" ? "Minor" : "Major"} ${key}`,
    vamp: `Daily Vamp ${variant === "major7" ? "Major7" : "Dominant7"} ${key}`,
    chromatic_tension: `Daily 251 Chromatic Tension ${key}`,
    net_original: `Daily 251 Net Original ${variant === "minor" ? "Minor" : "Major"} ${key}`,
    rhythm: `Daily 251 Rhythm Training ${key}`
  };
  currentPractice = {
    title: titleByCategory[category] || `Daily 251 ${key}`,
    mode: ((category === "diatonic" || category === "blues" || category === "net_original") && variant === "minor") ? "Minor" : "Major",
    key, chordPlan
  };
}

function downloadMidi(notes, title) {
  if (!notes || !notes.length) return;

  // Header Chunk (MThd)
  const header = [
    0x4D, 0x54, 0x68, 0x64, // "MThd"
    0x00, 0x00, 0x00, 0x06, // Length: 6
    0x00, 0x01,             // Format 1 (Multi-track)
    0x00, 0x02,             // Number of tracks: 2 (Conductor + Note track)
    0x00, 0xC0              // Division: 192 ticks per quarter note
  ];

  // Track 0: Conductor Track (Tempo & Time Signature)
  const track0Events = [
    0x00, 0xFF, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08, // Time Signature: 4/4
    0x00, 0xFF, 0x51, 0x03, 0x07, 0xA1, 0x20,       // Tempo: 120 BPM
    0x00, 0xFF, 0x2F, 0x00                          // End of Track
  ];
  const track0Header = [0x4D, 0x54, 0x72, 0x6B]; // "MTrk"
  const track0Len = track0Events.length;
  const track0LenBytes = [
    (track0Len >>> 24) & 0xFF,
    (track0Len >>> 16) & 0xFF,
    (track0Len >>> 8) & 0xFF,
    track0Len & 0xFF
  ];

  // Track 1: Note Track
  const ticksPerBeat = 192;
  const track1Events = [];

  // Track Name
  const trackName = "Sax Phrase";
  const nameBytes = Array.from(trackName).map(c => c.charCodeAt(0));
  track1Events.push(0x00, 0xFF, 0x03, nameBytes.length, ...nameBytes);

  function toVLQ(val) {
    val = Math.round(val);
    let buffer = [];
    buffer.push(val & 0x7F);
    while (val > 0x7F) {
      val >>>= 7;
      buffer.push((val & 0x7F) | 0x80);
    }
    return buffer.reverse();
  }

  const processed = [];
  notes.forEach(n => {
    if (n.tied && processed.length > 0) {
      processed[processed.length - 1].duration += n.duration;
    } else {
      processed.push({ ...n });
    }
  });

  let accumTime = 0;

  processed.forEach(n => {
    const durationTicks = n.duration * ticksPerBeat;

    if (n.rest) {
      accumTime += durationTicks;
    } else {
      const noteMap = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
      const pitch = (n.octave + 1) * 12 + noteMap[n.letter] + (n.accidental || 0);

      const noteOnVLQ = toVLQ(accumTime);
      track1Events.push(...noteOnVLQ, 0x90, pitch, 0x64);

      const noteOffVLQ = toVLQ(durationTicks);
      track1Events.push(...noteOffVLQ, 0x90, pitch, 0x00);

      accumTime = 0;
    }
  });

  // End of Track 1
  track1Events.push(0x00, 0xFF, 0x2F, 0x00);

  const track1Header = [0x4D, 0x54, 0x72, 0x6B]; // "MTrk"
  const track1Len = track1Events.length;
  const track1LenBytes = [
    (track1Len >>> 24) & 0xFF,
    (track1Len >>> 16) & 0xFF,
    (track1Len >>> 8) & 0xFF,
    track1Len & 0xFF
  ];

  const fileBytes = new Uint8Array([
    ...header,
    ...track0Header,
    ...track0LenBytes,
    ...track0Events,
    ...track1Header,
    ...track1LenBytes,
    ...track1Events
  ]);

  const filename = `${title.replace(/\s+/g, "_")}.mid`;
  return { fileBytes, filename, noteCount: processed.length };
}

async function saveMidiFile(fileBytes, filename) {
  const blob = new Blob([fileBytes], { type: "audio/midi" });

  // iOS/iPadOS (especially when the app is installed as a home-screen PWA) does not
  // reliably trigger a real file download for Blob + <a download> links, since standalone
  // web apps have no "Downloads" UI to catch it. The Web Share API instead opens the native
  // share sheet, which offers direct "ファイルに保存" / GarageBandへコピー options.
  if (navigator.canShare) {
    const file = new File([blob], filename, { type: "audio/midi" });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: filename });
        return "share";
      } catch (e) {
        if (e.name === "AbortError") return "cancelled";
        // Sharing failed for some other reason: fall through to the download-link method below.
      }
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return "download";
}

document.getElementById("midiBtn").addEventListener("click", async () => {

// アプリ内蔵メトロノーム: 外部のメトロノームアプリとはリアルタイム連携できない
// (Webページから他アプリの音を操作するAPIがiOS Safariに存在しない)ため、
// 代わりにWeb Audio APIでクリック音+メロディー音をこのページ内で鳴らす。
let metronomeAudioCtx = null;
let metronomeNodes = [];
let metronomePlaying = false;

function stopMetronome(){
  metronomeNodes.forEach(node => { try { node.stop(); } catch(e){} });
  metronomeNodes = [];
  metronomePlaying = false;
  document.getElementById("metronomeBtn").textContent = "▶ メトロノームで再生";
}

// クリック音: 音程のあるスクエア波だけだとピアノの倍音に埋もれて聞こえにくいため、
// 耳に届きやすいノイズ成分(打楽器的な「コツッ」という音)を重ねて音量も上げる。
function playClick(ctx, t, accent){
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(accent ? 0.55 : 0.4, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);

  const osc = ctx.createOscillator();
  osc.type = "square";
  osc.frequency.value = accent ? 1800 : 1200;
  osc.connect(gain);
  osc.start(t);
  osc.stop(t + 0.05);
  metronomeNodes.push(osc);

  const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;
  const filter = ctx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 4000;
  noise.connect(filter).connect(gain);
  noise.start(t);
  noise.stop(t + 0.05);
  metronomeNodes.push(noise);
  return t + 0.05;
}

// ピアノ音源は使わず、倍音を重ねる加算合成で近い音色を作る。
// ピアノは鍵盤を押し続けても音が減衰していく楽器なので、音の長さdurに関わらず
// 一定時間で減衰するエンベロープにするのがポイント。
function playPianoNote(ctx, freq, t, dur){
  const harmonics = [1, 2, 3, 4, 5, 6];
  const amps = [1, 0.55, 0.3, 0.18, 0.1, 0.06];
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  const decayTime = Math.max(dur, 0.4) + 0.6;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.3, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + decayTime);
  harmonics.forEach((h, i) => {
    const osc = ctx.createOscillator();
    const harmonicGain = ctx.createGain();
    harmonicGain.gain.value = amps[i];
    osc.type = "sine";
    osc.frequency.value = freq * h;
    osc.connect(harmonicGain).connect(gain);
    osc.start(t);
    osc.stop(t + decayTime);
    metronomeNodes.push(osc);
  });
  return t + decayTime;
}

function playMetronome(){
  if (!currentNotes || currentNotes.length === 0) return;
  if (!metronomeAudioCtx) metronomeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = metronomeAudioCtx;
  ctx.resume();

  const bpm = Number(document.getElementById("tempoInput").value) || 90;
  const secPerBeat = 60 / bpm;
  const repeatCount = Math.min(20, Math.max(1, Number(document.getElementById("repeatInput").value) || 1));
  const startAt = ctx.currentTime + 0.15;

  // タイをMIDI書き出し(downloadMidi)と同じロジックでマージする
  const merged = [];
  currentNotes.forEach(n => {
    if (n.tied && merged.length > 0) {
      merged[merged.length - 1].duration += n.duration;
    } else {
      merged.push({ ...n });
    }
  });

  const totalBars = Math.max(...currentNotes.map(n => n.barIndex)) + 1;
  const totalBeats = totalBars * 4;
  metronomeNodes = [];

  const noteMap = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  let lastEndAt = startAt;
  // 指定回数ぶん、同じフレーズを頭から続けて鳴らす
  for (let rep = 0; rep < repeatCount; rep++) {
    const repStartAt = startAt + rep * totalBeats * secPerBeat;
    for (let beat = 0; beat < totalBeats; beat++) {
      const t = repStartAt + beat * secPerBeat;
      const end = playClick(ctx, t, beat % 4 === 0);
      if (end > lastEndAt) lastEndAt = end;
    }
    merged.forEach(n => {
      if (n.rest) return;
      const absBeat = n.barIndex * 4 + n.beatInBar;
      const t = repStartAt + absBeat * secPerBeat;
      const dur = n.duration * secPerBeat;
      const midi = (n.octave + 1) * 12 + noteMap[n.letter] + (n.accidental || 0);
      const freq = 440 * Math.pow(2, (midi - 69) / 12);
      const end = playPianoNote(ctx, freq, t, dur);
      if (end > lastEndAt) lastEndAt = end;
    });
  }

  metronomePlaying = true;
  document.getElementById("metronomeBtn").textContent = "■ 停止";
  // 音の減衰(余韻)が終わる時刻まで待ってから止める。固定バッファだと
  // ロングトーンの余韻が残っているうちに止まってしまうことがあったため。
  const stopDelayMs = Math.max(0, (lastEndAt - ctx.currentTime) * 1000 + 150);
  setTimeout(() => { if (metronomePlaying) stopMetronome(); }, stopDelayMs);
}

document.getElementById("metronomeBtn").addEventListener("click", () => {
  if (metronomePlaying) stopMetronome();
  else playMetronome();
});
